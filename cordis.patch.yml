# dsh-academic-research-skills bundle patch.
#
# Mounts the ARS skill registrar into the profile's layer stack. On load it
# registers 5 model-invocable skills (deep-research, academic-paper,
# academic-paper-reviewer, academic-pipeline, sr-screener) and 16
# user-invocable /ars-* command wrappers into ctx.skills, so the skill catalog
# picks them up without any manual skill-root setup.
#
# Requires the `skills` service, which dsh-base mounts in every standard
# profile (row id `skill` -> @deepseek-ai/dsh-skill).

- insert:
    - id: ars-skills
      name: 'dsh-academic-research-skills/startup'
      inject: [skills]
